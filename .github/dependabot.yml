version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "develop"
    rebase-strategy: "auto"
    open-pull-requests-limit: 10
    versioning-strategy: increase
    ignore:
      # typescript-eslint cannot load TypeScript 7, which ships no compiler API
      # (typescript-eslint/typescript-eslint#10940): stay on 6.x until it can
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      react:
        patterns:
          - "react*"
          - "@types/react*"
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "develop"
    rebase-strategy: "auto"
    open-pull-requests-limit: 10
    versioning-strategy: increase
    groups:
      fastapi:
        patterns:
          - "fastapi*"
          - "uvicorn*"
          - "pydantic*"
      sqlalchemy:
        patterns:
          - "sqlalchemy*"
          - "alembic*"
      testing:
        patterns:
          - "pytest*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/backend"
      - "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "develop"
    rebase-strategy: "auto"
    open-pull-requests-limit: 5
    # The official images re-push their tags every few days, so the default
    # three-day cooldown skipped every new Python and Node release
    cooldown:
      exclude:
        - "*"
    # One pull request per image, for the production and dev Dockerfiles alike
    groups:
      base-images:
        group-by: dependency-name
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "develop"
    rebase-strategy: "auto"
    open-pull-requests-limit: 5
