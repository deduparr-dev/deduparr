name: Dependabot Auto-Rebase

on:
  # Manual trigger only
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebase-dependabot-prs:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.DEPENDABOT_REBASE_APP_ID }}
          private-key: ${{ secrets.DEPENDABOT_REBASE_APP_PRIVATE_KEY }}
      
      - name: Rebase outdated Dependabot PRs
        run: |
          # Get all open Dependabot PRs targeting develop
          prs=$(gh pr list --author "dependabot[bot]" --base develop --state open --json number --jq '.[].number')
          
          if [ -z "$prs" ]; then
            echo "No open Dependabot PRs found."
            exit 0
          fi
          
          for pr in $prs; do
            echo "Commenting @dependabot rebase on PR #$pr"
            gh pr comment "$pr" --body "@dependabot rebase" || echo "Failed to comment on PR #$pr"
          done
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
