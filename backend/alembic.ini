# Alembic configuration. The database URL is taken from application settings in
# alembic/env.py rather than being duplicated here.
[alembic]
script_location = alembic
prepend_sys_path = .

# A generated migration is formatted and linted the way CI checks backend code
[post_write_hooks]
hooks = ruff, black
ruff.type = module
ruff.module = ruff
ruff.options = check --fix --quiet REVISION_SCRIPT_FILENAME
black.type = module
black.module = black
black.options = --quiet REVISION_SCRIPT_FILENAME
