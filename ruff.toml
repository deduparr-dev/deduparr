# Ruff configuration (repository root)
#
# The lint rule set is pinned explicitly rather than relying on Ruff's implicit
# defaults. Ruff 0.16 expanded its default selection from 59 rules (E, F) to 413
# across many rule families, which turned a routine version bump into hundreds of
# lint errors on unchanged code. Selecting explicitly keeps `ruff check`
# deterministic across upgrades; new families can be adopted deliberately.
[lint]
select = ["E4", "E7", "E9", "F"]
